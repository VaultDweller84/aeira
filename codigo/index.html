<!DOCTYPE html>
<html lang="pt-PT" data-tema="sereno">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B5E8C">
<title>A Eira — Aldeia de João Pires</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A Eira">
<meta name="description" content="A Eira — o portal da Aldeia de João Pires. Avisos da terra, agenda do concelho de Penamacor e ajuda para tratar de assuntos com a Câmara. Village notices, what is on locally, and help with Câmara matters.">
<style>
/* =========================================================
   TEMAS — cada tema é só um conjunto de cores.
   Para criar um tema novo, copie um bloco e mude os valores.
   ========================================================= */
:root, :root[data-tema="sereno"]{
  --bg:#F2F6FA; --card:#FFFFFF; --ink:#16232E; --ink-soft:#4B5D6B;
  --marca:#1B5E8C; --marca-esc:#12435F; --marca-txt:#FFFFFF;
  --apoio:#2E7D5B; --apoio-esc:#215C43;
  --link:#12557E; --linha:#D3E0EA;
  --alerta-bg:#FFF4DA; --alerta-borda:#E3BE6A; --alerta-txt:#7A5600;
  --perigo-bg:#FDE7E4; --perigo-borda:#E0968A; --perigo-txt:#9B2E1C;
  --info-bg:#E6F0F7; --info-borda:#A5C6DD; --info-txt:#12557E;
  --chip:#E8EFF5; --rodape:#16232E; --rodape-txt:#D6E3EC;
}
:root[data-tema="terra"]{
  --bg:#FBF6EC; --card:#FFFFFF; --ink:#2B2118; --ink-soft:#5B4A38;
  --marca:#B4441F; --marca-esc:#8A3216; --marca-txt:#FFFFFF;
  --apoio:#4F6B2A; --apoio-esc:#3B5020;
  --link:#1F5B87; --linha:#E2D6C0;
  --alerta-bg:#FFF3D6; --alerta-borda:#E8C86A; --alerta-txt:#7A5A00;
  --perigo-bg:#FFE7E1; --perigo-borda:#E39880; --perigo-txt:#8A3216;
  --info-bg:#E8F1F8; --info-borda:#A9C9E0; --info-txt:#1F5B87;
  --chip:#F0E7D6; --rodape:#2B2118; --rodape-txt:#E8DCC8;
}
:root[data-tema="contraste"]{
  --bg:#000000; --card:#000000; --ink:#FFFFFF; --ink-soft:#EAEAEA;
  --marca:#FFD400; --marca-esc:#FFD400; --marca-txt:#000000;
  --apoio:#FFD400; --apoio-esc:#FFD400;
  --link:#7FD4FF; --linha:#FFFFFF;
  --alerta-bg:#000000; --alerta-borda:#FFD400; --alerta-txt:#FFD400;
  --perigo-bg:#000000; --perigo-borda:#FF6B57; --perigo-txt:#FF8C7A;
  --info-bg:#000000; --info-borda:#7FD4FF; --info-txt:#7FD4FF;
  --chip:#1A1A1A; --rodape:#000000; --rodape-txt:#FFFFFF;
}

/* =========================================================
   DESENHO — o que faz o portal parecer cuidado em vez de barato.
   Regras: uma cor de marca, poucas linhas, mais espaço, sombra ténue.
   O tema de alto contraste é a excepção a tudo isto: lá as linhas
   são grossas de propósito e não há sombra nenhuma.
   ========================================================= */
:root{
  --sombra:0 1px 2px rgba(16,35,46,.05), 0 6px 16px rgba(16,35,46,.06);
  --r:1rem;    /* raio dos cartões */
  --r-s:.7rem; /* raio de botões e campos */
}
:root[data-tema="contraste"]{--sombra:none}

/* =========================================================
   BASE — escrito primeiro para telemóvel
   ========================================================= */
*{box-sizing:border-box}
html{font-size:var(--base,19px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  /* Letra do próprio telemóvel: SF no iPhone, Roboto no Android, Segoe UI no
     Windows. Tão legível como a Verdana nestes tamanhos, e o portal deixa de
     parecer uma página de 2005. */
  font-family:system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:1rem;line-height:1.55;letter-spacing:.005em;
  /* Emails e endereços longos não partem sozinhos. Sem isto, com a letra
     grande a página passava a andar para o lado — ver 06-RISKS.md, R-17. */
  overflow-wrap:break-word;
  padding-bottom:5.6rem; /* espaço para a barra de baixo */
  -webkit-font-smoothing:antialiased;
}
:root[data-tema="contraste"] .card,
:root[data-tema="contraste"] .box,
:root[data-tema="contraste"] .tel,
:root[data-tema="contraste"] .noticia,
:root[data-tema="contraste"] .festa,
:root[data-tema="contraste"] details.item,
:root[data-tema="contraste"] .aviso-terra,
:root[data-tema="contraste"] input,
:root[data-tema="contraste"] select,
:root[data-tema="contraste"] textarea{border-width:3px}
.wrap{width:100%;margin:0 auto;padding:0 .9rem}
h1,h2,h3,h4{letter-spacing:-.012em}

/* Ícones da navegação: desenhados, monocromáticos, herdam a cor do tema.
   Antes eram emoji — mudavam de desenho conforme o telemóvel e ficavam
   coloridos mesmo no tema de alto contraste. */
.svgic{width:1.55em;height:1.55em;display:block;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- Cabeçalho ---- */
header.top{background:var(--marca);color:var(--marca-txt);padding:.9rem 0 .8rem}
header.top h1{margin:0;font-size:1.3rem;line-height:1.25}
header.top .sub{margin:.35rem 0 0;font-size:.9rem;opacity:.95}
.controlos{margin-top:.8rem;display:flex;flex-direction:column;gap:.5rem}
.grupoctl{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.grupoctl > .rot{font-size:.8rem;opacity:.95;flex:0 0 auto;min-width:5.2rem}
.controlos button{
  background:transparent;color:var(--marca-txt);border:2px solid rgba(255,255,255,.65);
  border-radius:.5rem;cursor:pointer;font-weight:700;font-family:inherit;
  padding:.35rem .75rem;line-height:1.2;font-size:.9rem;min-height:2.4rem;
}
.controlos button.on{background:var(--marca-txt);color:var(--marca);border-color:var(--marca-txt)}
.controlos button.s1{font-size:.9rem}
details.opcoes{margin-top:.2rem}
details.opcoes summary{
  list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;
  border:2px solid rgba(255,255,255,.65);border-radius:.5rem;
  padding:.45rem .8rem;font-size:.85rem;font-weight:700;min-height:2.4rem;
}
details.opcoes summary::-webkit-details-marker{display:none}
details.opcoes[open] summary{background:var(--marca-txt);color:var(--marca);border-color:var(--marca-txt)}
details.opcoes .painel{display:flex;flex-direction:column;gap:.5rem;margin-top:.6rem}
.controlos button.s2{font-size:1.15rem}
.controlos button.s3{font-size:1.4rem}

/* ---- Cartões de menu (só em ecrã largo) ---- */
nav.menu{display:none}

/* ---- Barra de navegação em baixo (telemóvel) ---- */
nav.barra{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  /* minmax(0,1fr) e não 1fr: com 1fr a coluna cresce até o nome caber,
     e seis nomes a crescer não cabem em 320 px — a barra saía do ecrã
     nos dois tamanhos de letra maiores e o último botão ficava invisível,
     precisamente para quem aumentou a letra por não ver bem. R-17. */
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  background:var(--card);border-top:1px solid var(--linha);
  box-shadow:0 -2px 14px rgba(16,35,46,.06);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.barra button{
  background:none;border:none;font-family:inherit;cursor:pointer;
  padding:.45rem .1rem .5rem;color:var(--ink-soft);
  display:flex;flex-direction:column;align-items:center;gap:.22rem;
  font-size:clamp(11px,.58rem,13px);font-weight:700;line-height:1.15;min-height:3.8rem;
  overflow:visible;hyphens:auto;
}
nav.barra button .ic{font-size:clamp(15px,.95rem,19px);line-height:1}
/* o nome nunca sai da sua coluna: sem isto, um nome mais largo do que a
   coluna encosta ao do botão do lado e três nomes leem-se como um só.
   Se não couber, parte — que é feio mas legível. R-17. */
nav.barra button>span:last-child{max-width:100%;overflow-wrap:anywhere;text-align:center}
nav.barra button.on{color:var(--marca);background:none}
nav.barra button.on .ic{background:var(--chip);border-radius:999px;padding:.18rem .85rem}
:root[data-tema="contraste"] nav.barra{border-top-width:3px}

/* ---- Secções ---- */
section{padding:1.2rem 0 .5rem}
section h2{font-size:1.45rem;font-weight:800;margin:0 0 .55rem;line-height:1.25;display:block}
section h2::after{content:"";display:block;width:2.4rem;height:3px;border-radius:2px;
  background:var(--marca);margin-top:.45rem}
.lead{font-size:.98rem;color:var(--ink-soft);margin:.5rem 0 1.1rem;max-width:44rem}
.hidden{display:none}

.box{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);
  box-shadow:var(--sombra);padding:1.1rem;margin-bottom:1rem}
.box h3{margin:.1rem 0 .5rem;font-size:1.1rem}
.aviso{background:var(--alerta-bg);border:1px solid var(--alerta-borda);border-radius:var(--r);
  padding:.9rem 1rem;margin:.9rem 0;font-size:.95rem}
.aviso strong{color:var(--alerta-txt)}
.urgente{background:var(--perigo-bg);border-color:var(--perigo-borda)}
.urgente strong{color:var(--perigo-txt)}
.nota-en{background:var(--info-bg);border:1px solid var(--info-borda);border-radius:var(--r);
  padding:.9rem 1rem;margin:.9rem 0;font-size:.95rem}
.nota-en strong{color:var(--info-txt)}
a{color:var(--link)}

/* ---- Formulário ---- */
label{display:block;font-weight:700;margin:1rem 0 .3rem;font-size:1rem}
label .dica{display:block;font-weight:400;font-size:.83rem;color:var(--ink-soft);margin-top:.1rem}
input[type=text],input[type=email],input[type=tel],select,textarea{
  width:100%;font-family:inherit;font-size:1.05rem;padding:.75rem .8rem;
  border:1px solid var(--linha);border-radius:var(--r-s);background:var(--card);color:var(--ink);
  min-height:3rem;
}
input:focus,select:focus,textarea:focus{outline:3px solid var(--marca);outline-offset:1px;border-color:var(--marca)}
textarea{min-height:7rem;resize:vertical}
select{cursor:pointer}
/* A lista aberta é desenhada pelo sistema e nem todos os telemóveis
   aceitam estilo. Onde aceitam, o título do grupo destaca-se do que
   se pode escolher; onde não aceitam, os travessões do próprio texto
   fazem o trabalho. D-021 */
select optgroup{font-weight:700;font-style:normal;color:var(--ink-soft);
  background:var(--chip)}
select option{font-weight:400;color:var(--ink);background:var(--card);
  padding-left:.6rem}
.check{display:flex;gap:.7rem;align-items:flex-start;margin-top:.9rem;font-size:.98rem}
.check input{width:2rem;height:2rem;margin-top:.1rem;flex:0 0 auto;accent-color:var(--marca)}

.botoes{display:flex;flex-direction:column;gap:.6rem;margin-top:1.2rem}
.btn{font-family:inherit;font-size:1.05rem;font-weight:700;padding:.9rem 1.1rem;
  border-radius:var(--r-s);border:1px solid transparent;cursor:pointer;text-decoration:none;
  display:block;text-align:center;width:100%;min-height:3.2rem}
.btn-principal{background:var(--marca);color:var(--marca-txt);border-color:var(--marca);
  box-shadow:0 2px 8px rgba(27,94,140,.28)}
:root[data-tema="contraste"] .btn-principal{box-shadow:none}
:root[data-tema="contraste"] .btn{border-width:3px}
.btn-2{background:var(--card);color:var(--ink);border-color:var(--linha)}
.btn-verde{background:var(--apoio);color:var(--marca-txt);border-color:var(--apoio)}
:root[data-tema="contraste"] .btn-verde,
:root[data-tema="contraste"] .btn-principal{color:#000}

#textoCarta{white-space:pre-wrap;background:var(--card);border:2px dashed var(--linha);
  border-radius:.7rem;padding:1rem;font-size:.97rem;line-height:1.65;margin-top:1rem}
.copiado{color:var(--apoio-esc);font-weight:700;margin-top:.6rem;font-size:.98rem}
.privacidade{font-size:.85rem;color:var(--ink-soft);margin:.8rem 0 0;line-height:1.5}
.estado{margin:.9rem 0 0;font-size:.95rem;font-weight:700;padding:.7rem .85rem;border-radius:.6rem;
  background:var(--info-bg);border:2px solid var(--info-borda);color:var(--info-txt)}
.estado.mau{background:var(--alerta-bg);border-color:var(--alerta-borda);color:var(--alerta-txt)}
.btn[disabled]{opacity:.65;cursor:progress}
.girar{display:inline-block;animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.girar{animation:none}}
:root[data-tema="contraste"] .copiado{color:var(--marca)}

/* ---- Glossário ---- */
.procura{margin-bottom:.8rem}
.procura input{margin-bottom:.6rem}
.filtros{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.1rem}
.filtro{font-family:inherit;font-size:.88rem;font-weight:700;cursor:pointer;background:var(--card);
  border:1px solid var(--linha);border-radius:999px;padding:.5rem .9rem;color:var(--ink-soft);min-height:2.6rem}
.filtro.on{background:var(--marca);border-color:var(--marca);color:var(--marca-txt)}
details.item{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);
  box-shadow:var(--sombra);margin-bottom:.6rem;overflow:hidden}
details.item[open]{border-color:var(--marca)}
details.item summary{cursor:pointer;padding:.9rem 1rem;font-size:1.02rem;font-weight:700;
  list-style:none;display:flex;gap:.6rem;align-items:baseline;min-height:3rem}
details.item summary::-webkit-details-marker{display:none}
details.item summary::before{content:"▸";color:var(--marca);font-size:1.15rem;flex:0 0 auto}
details.item[open] summary::before{content:"▾"}
.corpo{padding:.8rem 1rem 1rem;border-top:2px solid var(--linha)}
.corpo ol,.corpo ul{padding-left:1.3rem;margin:.5rem 0}
.corpo li{margin-bottom:.45rem}
.corpo p{margin:.5rem 0}
.tag{display:inline-block;font-size:.78rem;font-weight:600;letter-spacing:.02em;
  background:var(--chip);color:var(--ink-soft);border-radius:999px;padding:.15rem .7rem;margin-bottom:.5rem}
.semresultado{padding:1.3rem;text-align:center;color:var(--ink-soft);font-size:1rem}

/* ---- Filtro por terra (T-23) ---- */
.filtro-terra{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.2rem 0 .9rem}
.filtro-terra label{font-weight:700;font-size:.95rem;color:var(--ink-soft)}
.filtro-terra select{flex:1 1 12rem;min-width:0;font-family:inherit;font-size:1rem;
  padding:.55rem .6rem;border:1px solid var(--linha);border-radius:.6rem;
  background:var(--card);color:var(--ink)}
:root[data-tema="contraste"] .filtro-terra select{border-width:3px}
.cabeca-aviso .terra{font-weight:700;color:var(--marca);overflow-wrap:anywhere}
:root[data-tema="contraste"] .cabeca-aviso .terra{color:#000}

/* ---- Notícias e avisos ---- */
.aviso-terra{background:var(--card);border:1px solid var(--linha);border-left-width:6px;
  border-radius:var(--r);box-shadow:var(--sombra);padding:1rem;margin-bottom:.7rem}
.aviso-terra.cat-urgente{border-left-color:var(--perigo-borda);background:var(--perigo-bg)}
.aviso-terra.cat-servico{border-left-color:var(--marca)}
.aviso-terra.cat-comunidade{border-left-color:var(--apoio)}
.aviso-terra.cat-luto{border-left-color:var(--ink-soft)}
.cabeca-aviso,.cabeca-noticia{display:flex;align-items:center;gap:.4rem .5rem;margin:0 0 .35rem;
  font-size:.82rem;color:var(--ink-soft);flex-wrap:wrap;min-width:0}
.cabeca-aviso>*,.cabeca-noticia>*{min-width:0}
.cabeca-aviso .icone{font-size:1.15rem}
.novo{background:var(--marca);color:var(--marca-txt);font-size:.68rem;font-weight:700;
  border-radius:1rem;padding:.1rem .55rem;letter-spacing:.03em}
:root[data-tema="contraste"] .novo{color:#000}
.aviso-terra h4{margin:0 0 .25rem;font-size:1.08rem;line-height:1.35}
.texto-aviso{margin:.3rem 0 0;font-size:.95rem;color:var(--ink-soft)}
.noticia{display:flex;gap:.8rem;background:var(--card);border:1px solid var(--linha);
  border-radius:var(--r);box-shadow:var(--sombra);padding:1rem;margin-bottom:.7rem;
  text-decoration:none;color:var(--ink);
  align-items:flex-start}
.noticia:hover{border-color:var(--marca)}
.noticia .miniatura{width:5rem;height:5rem;object-fit:cover;border-radius:.5rem;flex:0 0 auto}
.texto-noticia{flex:1;min-width:0}
.noticia h4{margin:0 0 .3rem;font-size:1rem;line-height:1.35}
.noticia .resumo{margin:.2rem 0;font-size:.88rem;color:var(--ink-soft)}
.fontes{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0 0}
.fontes a{display:inline-block;border:2px solid var(--linha);border-radius:.6rem;
  padding:.5rem .85rem;text-decoration:none;font-size:.9rem;font-weight:700;
  color:var(--link);background:var(--card);min-height:2.6rem}

/* ---- Agenda cultural ---- */
.cabecaAgenda .aviso{margin-top:0}
.festa{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);
  box-shadow:var(--sombra);padding:1rem;
  margin-bottom:.7rem;width:100%;text-align:left;font-family:inherit;font-size:1rem;
  color:var(--ink);cursor:pointer;display:block}
.festa:hover{border-color:var(--marca)}
.corpo-festa{flex:1;min-width:0}
.ver-mais{display:block;margin-top:.45rem;font-size:.85rem;font-weight:700;color:var(--link)}
.tag.fonte-cm{background:var(--info-bg);color:var(--info-txt)}
.tag.fonte-ag{background:var(--chip);color:var(--apoio-esc)}
.detalhe h3{font-size:1.25rem;margin:.4rem 0 .6rem;line-height:1.3}
.detalhe .quando{font-size:1.05rem;margin:.3rem 0}
.detalhe .onde{margin:.3rem 0;color:var(--ink-soft)}
.detalhe .desc{margin:.9rem 0;white-space:normal}
.detalhe .desc.quieto{color:var(--ink-soft);font-style:italic}
.detalhe .foto{width:100%;height:auto;border-radius:.6rem;margin:.8rem 0;border:2px solid var(--linha)}
.voltar{margin-bottom:1rem;width:auto;display:inline-block}
.festa.destaque{border-color:var(--apoio);border-width:3px}
.cabeca{display:flex;gap:.8rem;align-items:flex-start}
.data{flex:0 0 4.4rem;background:var(--apoio);color:var(--marca-txt);border-radius:.55rem;
  text-align:center;padding:.45rem .25rem;font-weight:700;line-height:1.2}
:root[data-tema="contraste"] .data{color:#000}
.data .dia{display:block;font-size:1.35rem}
.data .dia.pequeno{font-size:.78rem;line-height:1.3}
.data .mes{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
.festa h4{margin:0 0 .15rem;font-size:1.05rem;line-height:1.3}
.festa p{margin:.1rem 0;font-size:.92rem;color:var(--ink-soft)}
.mapa{display:inline-flex;align-items:center;gap:.4rem;margin-top:.6rem;
  font-size:.9rem;font-weight:700;text-decoration:none;color:var(--link);
  border:2px solid var(--linha);border-radius:.6rem;padding:.5rem .8rem;min-height:2.6rem}
.mesbloco{margin:1.6rem 0 .7rem;font-size:.82rem;font-weight:800;color:var(--ink);
  text-transform:uppercase;letter-spacing:.06em;opacity:.85;
  border-bottom:1px solid var(--linha);padding-bottom:.35rem}
:root[data-tema="contraste"] .mesbloco{color:var(--marca);opacity:1}

/* ---- Telefones ---- */
.tel{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);
  box-shadow:var(--sombra);padding:.95rem 1.05rem;margin-bottom:.65rem}
.tel .quem{font-weight:700;font-size:1rem;display:block}
.tel .quem small{display:block;font-weight:400;font-size:.85rem;color:var(--ink-soft);margin-top:.15rem}
.tel a.num{display:inline-block;margin-top:.5rem;font-size:1.25rem;font-weight:700;color:var(--link);
  text-decoration:none;border-bottom:3px solid var(--linha)}
.tel .mapa{margin-top:.5rem;margin-left:.6rem}
.emergencia{background:var(--marca);color:var(--marca-txt);border-color:var(--marca-esc)}
.emergencia .quem small{color:var(--marca-txt);opacity:.9}
.emergencia a.num{color:var(--marca-txt);border-color:rgba(255,255,255,.55)}
.emergencia .mapa{color:var(--marca-txt);border-color:rgba(255,255,255,.55)}
:root[data-tema="contraste"] .emergencia{background:#000;border-color:var(--marca)}
:root[data-tema="contraste"] .emergencia .quem,
:root[data-tema="contraste"] .emergencia .quem small{color:var(--marca)}
:root[data-tema="contraste"] .emergencia a.num{color:var(--marca);border-color:var(--marca)}
:root[data-tema="contraste"] .emergencia .mapa{color:var(--marca);border-color:var(--marca)}

footer{background:var(--rodape);color:var(--rodape-txt);margin-top:2rem;padding:1.5rem 0;font-size:.9rem}
footer a{color:var(--rodape-txt)}
:root[data-tema="contraste"] footer{border-top:3px solid var(--marca)}

/* =========================================================
   ECRÃS MAIORES
   ========================================================= */
/* =========================================================
   CABEÇALHO NO TELEMÓVEL — mobília não é conteúdo.
   O botão de letra grande existe para o texto que se lê crescer,
   não para o título e os botões comerem o ecrã. Antes desta regra,
   no tamanho maior o cabeçalho ocupava 60% do primeiro ecrã e a
   pessoa abria o portal sem ver conteúdo nenhum.
   ========================================================= */
@media (max-width:39.99rem){
  header.top{padding:.7rem 0 .6rem}
  header.top h1{font-size:clamp(21px,1.3rem,30px)}
  header.top .sub{font-size:clamp(13px,.85rem,17px);margin-top:.2rem}
  /* língua e opções na mesma linha; se não couberem, passam para a de baixo */
  header.top .controlos{flex-direction:row;flex-wrap:wrap;align-items:center;
    gap:.35rem;margin-top:.55rem}
  header.top .controlos > .grupoctl{flex:0 1 auto;flex-wrap:nowrap;gap:.3rem;min-width:0}
  /* o rótulo «Língua» sai: os botões dizem Português e English */
  header.top .controlos > .grupoctl > .rot{display:none}
  header.top .controlos > .grupoctl > button{font-size:clamp(13px,.85rem,16px);
    padding:.35rem .5rem;white-space:nowrap;min-height:2.4rem}
  header.top details.opcoes{margin-top:0;flex:0 0 auto}
  header.top details.opcoes summary{font-size:clamp(13px,.85rem,16px);
    padding:.4rem .55rem;white-space:nowrap;min-height:2.4rem}
}

@media (min-width:40rem){
  html{font-size:var(--base,20px)}
  .wrap{max-width:44rem;padding:0 1.2rem}
  header.top{padding:1.3rem 0 1.1rem}
  header.top h1{font-size:1.7rem}
  header.top .sub{font-size:1rem}
  .controlos{flex-direction:row;flex-wrap:wrap;gap:.5rem 1.6rem;align-items:center}
  .grupoctl > .rot{min-width:0}
  details.opcoes{margin-top:0}
  details.opcoes summary{display:none}
  details.opcoes .painel{display:flex;flex-direction:row;flex-wrap:wrap;gap:.5rem 1.6rem;margin-top:0}
  .botoes{flex-direction:row;flex-wrap:wrap}
  .btn{width:auto;display:inline-block}
  .procura{display:flex;gap:.6rem;align-items:center}
  .procura input{margin-bottom:0;flex:1 1 16rem}
  .procura .btn{flex:0 0 auto}
  .tel{display:flex;flex-wrap:wrap;gap:.3rem 1rem;justify-content:space-between;align-items:center}
  .tel .quem{flex:1 1 18rem}
  .tel a.num{margin-top:0;font-size:1.3rem}
}
@media (min-width:56rem){
  .wrap{max-width:56rem}
  body{padding-bottom:1rem}
  nav.barra{display:none}
  nav.menu{display:block;padding:1.5rem 0 .3rem}
  .menu-grid{display:grid;gap:1rem;grid-template-columns:repeat(2,1fr)}
  .menu-card{display:flex;align-items:center;gap:.9rem;background:var(--card);
    border:2px solid var(--linha);border-radius:1rem;padding:1.1rem 1rem;color:var(--ink);
    cursor:pointer;text-align:left;font-family:inherit;font-size:1.1rem;font-weight:700;width:100%}
  .menu-card.on{border-color:var(--marca);border-width:3px}
  .menu-card .ic{font-size:2rem;line-height:1}
  .menu-card small{display:block;font-weight:400;font-size:.85rem;color:var(--ink-soft);margin-top:.15rem}
  section h2{font-size:1.6rem}
  .festa{display:flex;gap:1rem;align-items:flex-start}
  .cabeca{flex:1;gap:1rem}
  .festa .mapa{margin-top:0;flex:0 0 auto;align-self:center}
}

@media print{
  header.top,nav.barra,nav.menu,.botoes,footer,.filtros,.procura,.aviso,.nota-en,.mapa{display:none!important}
  #textoCarta{border:none;padding:0;font-size:12pt}
  body{background:#fff;color:#000;padding:0}
}

 carta_lead:'Answer the questions below. A finished letter appears at the end, properly worded, ready to email or to print and hand in.',
 carta_urgente:'<strong>If it is an emergency, do not write — telephone.</strong><br>Burst pipe or no water: <a href="tel:963183208">963 183 208</a> (standby crew, day and night). Fire, accident or serious illness: <a href="tel:112">112</a>.',
 carta_nota_en:'<strong>Please note:</strong> the letter itself is written in Portuguese, because that is the language the Câmara Municipal works in — an English letter is far less likely to get a result. You will get a plain-English summary of what it says before you send it. Fill in the form in English or Portuguese, whichever you prefer; only what you write yourself in box 8 appears in your own words, so if you can manage that bit in Portuguese, do.',

 q1:'1. What is it about?', q1d:'Pick the subject closest to your case.',
 q2:'2. Your full name', q2d:'Write your name exactly as on your ID or passport, not a nickname — on an official letter it matters.', q2p:'e.g. John Smith',
 q3:'3. Your address', q3p:'e.g. Rua da Fonte 12, 6090-159 Aldeia de João Pires',
 q4:'4. Your mobile or telephone', q4d:'So the Câmara can reach you.', q4p:'e.g. 912 345 678',
 q5:'5. Your email', q5d:'Leave blank if you have none.', q5p:'e.g. john@gmail.com',
 q6:'6. Where is the problem?', q6d:'Give the street and a landmark anyone would recognise.', q6p:'e.g. Rua do Outeiro, opposite the café',
 q7:'7. Since when?', q7p:'e.g. for about three weeks',
 q6_pedido:'6. Which house or plot does this concern?', q6d_pedido:'The address of the place you are asking about.', q6p_pedido:'e.g. Rua do Outeiro 3',
 enc_apoio:'<strong>This is not done by letter to the Presidente.</strong><br>The Câmara\'s social support — reduced water tariff, Cartão Penamacor Social, housing help, health costs — is handled by the Unidade de Educação, Ação Social e Saúde, and nearly all of it has its own form, filled in there.<br><br>📞 <a href="tel:277394040">277 394 040</a><br>✉️ <a href="mailto:gab.social@cm-penamacor.pt">gab.social@cm-penamacor.pt</a><br>📍 Rua dos Bombeiros Voluntários, Penamacor<br>🕘 Monday to Friday, 9.00–12.30 and 14.00–16.00<br><br>Take your ID with you. <strong>Ring first</strong> to ask which papers are needed — it saves a journey.<br><br>If you have already been and had no answer, then a letter is worth writing: pick «Something else (I will write it myself)» above and say what happened.',
 enc_botao:'See it in the «How to» guide',
 grupo_queixas:'— PROBLEMS TO REPORT TO THE CÂMARA —',
 grupo_pedidos:'— REQUESTS, INFORMATION AND SUPPORT —',
 nota_obras:'<strong>This is for <em>asking</em>, not for applying.</strong> To request information — whether you need consent, what you may do on your land, which papers are required — this letter works well. But <strong>applying for building consent, or filing a comunicação prévia, is done on the Câmara\'s own form</strong>, with drawings and signed technical declarations, and this letter does not replace that. If in doubt, ring first: <a href="tel:277394106">277 394 106</a>.',
 falta_local:'<strong>The place is missing.</strong> Without it the Câmara does not know where to go and look, and the request usually stalls. Give the street and a landmark anyone would recognise. If you really do not know, press the button again and the letter will be written anyway.',

 q8p:'e.g. The rubbish bin is always overflowing and waste ends up on the ground. There are rats now and the smell is very bad.',

var LANG='pt';
function t(k){ return T[LANG][k]; }

/* ---------------- PREFERÊNCIAS GUARDADAS ----------------
   ADR-024. Quatro escolhas de apresentação e mais nada: terra,
   tema, letra e língua. Não há contas, não há senhas, não há
   cookies, e nada disto sai do aparelho.

   Tudo em try/catch: um browser que recuse o armazenamento
   (janela anónima, definições apertadas) não pode partir o
   portal — só esquecer. É o ADR-007 aplicado ao armazenamento.
-------------------------------------------------------- */
function lerPref(k,defeito){
  try{ var v=window.localStorage.getItem('aeira.'+k); return (v===null?defeito:v); }
  catch(e){ return defeito; }
}
function guardarPref(k,v){
  try{ window.localStorage.setItem('aeira.'+k,v); }catch(e){}
}

function letra(px,btn){
  document.documentElement.style.setProperty('--base',px+'px');
  var g=btn.parentNode;
  Array.prototype.forEach.call(g.querySelectorAll('button'),function(b){b.classList.remove('on');});
  btn.classList.add('on');
  guardarPref('letra',px);
}
function setTema(nome,btn){
  document.documentElement.setAttribute('data-tema',nome);
  var g=btn.parentNode;
  Array.prototype.forEach.call(g.querySelectorAll('button'),function(b){b.classList.remove('on');});
  btn.classList.add('on');
  var cores={sereno:'#1B5E8C',terra:'#B4441F',contraste:'#000000'};
  var m=document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content',cores[nome]);
  guardarPref('tema',nome);
}
function ajustarOpcoes(){
  var d=document.getElementById('opcoes');
  if(!d) return;
  if(window.matchMedia('(min-width:640px)').matches) d.setAttribute('open','');
  else d.removeAttribute('open');
}
window.addEventListener('resize', ajustarOpcoes);
function abrir(id){
  ['noticias','carta','glossario','agenda','telefones','sugestoes'].forEach(function(s){
    document.getElementById(s).classList.toggle('hidden', s!==id);
  });
  document.querySelectorAll('[data-alvo]').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-alvo')===id);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function aplicarTextos(){
  document.documentElement.lang=t('htmlLang');
  document.title=t('tituloPagina')||t('titulo');
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var k=el.getAttribute('data-i18n');
    if(T[LANG][k]!==undefined) el.innerHTML=T[LANG][k];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){
    var k=el.getAttribute('data-i18n-ph');
    if(T[LANG][k]!==undefined) el.setAttribute('placeholder',T[LANG][k]);
  });
  document.getElementById('notaEN').classList.toggle('hidden', LANG!=='en');
}
function setLang(l){
  LANG=l;
  guardarPref('lingua',l);
  document.getElementById('btnPT').classList.toggle('on', l==='pt');
  document.getElementById('btnEN').classList.toggle('on', l==='en');
  aplicarTextos(); encherAssuntos(); desenharGlossario(); desenharNoticias(); desenharAgenda(); desenharTelefones();
  document.getElementById('resultado').classList.add('hidden');
}
</script>

 '<ol><li>Telefone ao piquete e diga a rua exacta e o que vê (água a correr, sem água, água escura).</li>'+
 '<li>Se a água sair suja ou castanha, <strong>não beba nem cozinhe com ela</strong> até que digam que já pode.</li>'+
 '<li>Se houver água a inundar terreno ou casa, tire fotografias — servem depois para um pedido de reparação.</li></ol>'+
 '<p>Durante o horário da Câmara também pode ligar <a href="tel:277394106">277 394 106</a>.</p>',
 c_en:'<div class="aviso urgente"><strong>This is urgent. Telephone — do not write.</strong><br>Water standby crew: <a href="tel:963183208">963 183 208</a> — operates outside office hours.</div>'+
 '<ol><li>Ring the standby crew, give the exact street and say what you can see (water running, no supply, discoloured water).</li>'+
 '<li>If the water runs dirty or brown, <strong>do not drink it or cook with it</strong> until you are told it is safe.</li>'+
 '<li>If water is flooding land or a house, take photographs — you will need them for a repair claim later.</li></ol>'+
 '<p>During office hours you can also ring <a href="tel:277394106">277 394 106</a>.</p>'},

{cat:1,
 t_pt:'Comunicar a leitura do contador da água',
 t_en:'Sending in your water meter reading',
 k_pt:'leitura contador agua factura conta estimada whatsapp',
 k_en:'meter reading water bill estimate estimated whatsapp',
 c_pt:'<p>Um funcionário do Município lê os contadores <strong>de dois em dois meses</strong>. Se não conseguir ler o seu (portão fechado, ninguém em casa), a factura vem <em>por estimativa</em> — pode vir a mais ou a menos.</p>'+
 '<p>Pode dar a leitura você mesmo, de três maneiras:</p>'+
 '<ul><li><strong>WhatsApp:</strong> <a href="tel:922231350">922 231 350</a> — tire uma fotografia ao contador com os números bem visíveis e envie, com o seu nome e morada. É a maneira mais simples.</li>'+
 '<li><strong>Email:</strong> <a href="mailto:sas.info@cm-penamacor.pt">sas.info@cm-penamacor.pt</a></li>'+
 '<li><strong>Ao balcão</strong> da Secretaria da Câmara, em Penamacor.</li></ul>'+
 '<p><strong>Dica:</strong> dê a leitura sempre no mesmo período do mês. Assim a conta bate certo e não há surpresas.</p>',
 c_en:'<p>A Câmara employee reads the meters <strong>every two months</strong>. If yours cannot be read (gate locked, nobody home), the bill is <em>estimated</em> — which can be too high or too low.</p>'+
 '<p>You can send the reading in yourself, three ways:</p>'+
 '<ul><li><strong>WhatsApp:</strong> <a href="tel:922231350">922 231 350</a> — photograph the meter with the digits clearly visible and send it with your name and address. This is the simplest way, and useful if you are away a lot.</li>'+
 '<li><strong>Email:</strong> <a href="mailto:sas.info@cm-penamacor.pt">sas.info@cm-penamacor.pt</a></li>'+
 '<li><strong>In person</strong> at the Câmara secretariat in Penamacor.</li></ul>'+
 '<p><strong>Tip:</strong> send the reading at the same point each month. The account then stays accurate and there are no nasty surprises.</p>'},

{cat:1,
 t_pt:'Pagar a factura da água',
 t_en:'Paying the water bill',
 k_pt:'pagar factura conta agua ctt payshop multibanco tesouraria transferencia debito',
 k_en:'pay bill water post office payshop atm treasury transfer direct debit',
 c_pt:'<p>Pode pagar em qualquer um destes sítios:</p>'+
 '<ul><li><strong>Tesouraria da Câmara</strong>, em Penamacor (dinheiro ou cartão).</li>'+
 '<li><strong>Correios (CTT)</strong>.</li><li><strong>Payshop</strong> — em muitos cafés e mercearias.</li>'+
 '<li><strong>Multibanco</strong>, com os dados que vêm na factura.</li>'+
 '<li><strong>Débito directo</strong> — a conta é paga sozinha, todos os meses, na sua conta do banco. Pede-se na Câmara. É o que menos dá trabalho a quem tem dificuldade em deslocar-se.</li></ul>'+
 '<p>Se a factura vier num valor estranho, <strong>não deixe passar</strong>: ligue <a href="tel:277394106">277 394 106</a> antes da data-limite e peça a verificação. Pode ser uma rotura escondida ou um erro de leitura.</p>',
 c_en:'<p>You can pay at any of these:</p>'+
 '<ul><li><strong>The Câmara treasury</strong> in Penamacor (cash or card).</li>'+
 '<li><strong>The Post Office (CTT)</strong>.</li><li><strong>Payshop</strong> — available in many cafés and grocers.</li>'+
 '<li><strong>Cash machine (Multibanco)</strong>, using the reference details printed on the bill.</li>'+
 '<li><strong>Direct debit</strong> — the bill is paid automatically from your bank account. Arrange it at the Câmara. Much the easiest option if you are away or find travelling difficult.</li></ul>'+
 '<p>If a bill looks wrong, <strong>do not let it go</strong>: ring <a href="tel:277394106">277 394 106</a> before the due date and ask for it to be checked. It may be a hidden leak or a misread meter.</p>'},

{cat:1,
 t_pt:'Pedir um contador de água novo',
 t_en:'Applying for a new water meter',
 k_pt:'contador novo ligacao agua casa contrato ramal escritura',
 k_en:'new meter water connection house contract supply deeds',
 c_pt:'<p>Faz-se na Secretaria da Câmara, em Penamacor. Leve consigo:</p>'+
 '<ul><li>Cartão de cidadão (ou bilhete de identidade e número de contribuinte).</li>'+
 '<li><strong>Documento da casa</strong> — escritura, caderneta predial ou licença de construção.</li>'+
 '<li>Um comprovativo de morada (uma factura da luz, por exemplo).</li></ul>'+
 '<p>Antes de ir, telefone <a href="tel:277394106">277 394 106</a> e confirme o que é preciso no seu caso — poupa-lhe uma viagem.</p>',
 c_en:'<p>This is done at the Câmara secretariat in Penamacor. Take with you:</p>'+
 '<ul><li>Your ID card or passport, plus your Portuguese tax number (<em>número de contribuinte</em> / NIF).</li>'+
 '<li><strong>Proof of the property</strong> — the deeds, the land registry booklet (<em>caderneta predial</em>) or the building licence.</li>'+
 '<li>Proof of address (an electricity bill, for instance).</li></ul>'+
 '<p>Ring <a href="tel:277394106">277 394 106</a> before you go to confirm what is needed in your case — it saves a wasted journey.</p>'},

{cat:1,
 t_pt:'Tarifa social da água — desconto para quem tem poucos rendimentos',
 t_en:'Reduced water tariff for households on a low income',
 k_pt:'tarifa social agua desconto apoio reforma pensao barato',
 k_en:'social tariff water discount support pension low income reduction',
 c_pt:'<p>O Município tem uma <strong>tarifa social</strong>: um desconto na conta da água para famílias com menos posses.</p>'+
 '<ol><li>Peça o boletim de candidatura na Câmara ou no site do Município.</li>'+
 '<li>Preencha e entregue, com os documentos que pedirem.</li>'+
 '<li>Dúvidas: <a href="tel:277394040">277 394 040</a> ou <a href="mailto:gab.social@cm-penamacor.pt">gab.social@cm-penamacor.pt</a>.</li></ol>'+
 '<p>Não tem de ter vergonha de pedir: é um direito previsto no regulamento, não é um favor.</p>',
 c_en:'<p>The Câmara operates a <strong>social tariff</strong>: a discount on the water bill for households of limited means.</p>'+
 '<ol><li>Ask for the application form at the Câmara, or download it from the Câmara website.</li>'+
 '<li>Fill it in and hand it in with whatever documents they ask for.</li>'+
 '<li>Questions: <a href="tel:277394040">277 394 040</a> or <a href="mailto:gab.social@cm-penamacor.pt">gab.social@cm-penamacor.pt</a>.</li></ol>'+
 '<p>There is nothing to be embarrassed about in applying: it is a right set out in the regulations, not a favour.</p>'},

{cat:1,
 t_pt:'Esgotos entupidos, cheiros ou saneamento',
 t_en:'Blocked drains, smells or sewerage',
 k_pt:'esgoto saneamento entupido cheiro mau fossa cano sarjeta',
 k_en:'drain sewer blocked smell septic tank pipe gully',
 c_pt:'<ol><li><strong>Se o entupimento é dentro da sua casa ou do seu quintal</strong>, é da sua conta — chame um canalizador.</li>'+
 '<li><strong>Se é na rua</strong> (tampa de saneamento, cheiro à saída de uma sarjeta, esgoto a correr), é do Município: <a href="tel:277394106">277 394 106</a>, ou o piquete <a href="tel:963183208">963 183 208</a> fora de horas.</li>'+
 '<li>Se se repetir vezes sem conta, escreva pelo gerador de cartas: um problema recorrente por escrito obriga a uma solução de fundo, não só a uma desentupidela.</li></ol>',
 c_en:'<ol><li><strong>If the blockage is inside your house or your yard</strong>, it is your own responsibility — call a plumber.</li>'+
 '<li><strong>If it is in the street</strong> (a manhole, a smell from a gully, sewage running), it is the Câmara’s: <a href="tel:277394106">277 394 106</a>, or the standby crew on <a href="tel:963183208">963 183 208</a> out of hours.</li>'+
 '<li>If it keeps happening, write using the letter writer: a recurring problem set out in writing forces a proper fix rather than another quick unblocking.</li></ol>'},

{cat:1,
 t_pt:'Cemitério — sepulturas, campas, limpeza e taxas',
 t_en:'Cemetery — graves, plots, upkeep and fees',
 k_pt:'cemiterio campa sepultura jazigo coval taxa ossos transladacao funeral',
 k_en:'cemetery grave plot tomb burial fee exhumation remains funeral',
 c_pt:'<p>Os cemitérios do concelho são geridos pelo Município, com apoio da Junta de Freguesia.</p>'+
 '<ul><li><strong>Pedir ou renovar uma sepultura, tratar de taxas, pedir a exumação (levantamento de ossadas):</strong> Secretaria da Câmara, <a href="tel:277394106">277 394 106</a>.</li>'+
 '<li><strong>Limpeza, água, portões ou caminhos do cemitério em mau estado:</strong> comece pela Junta de Freguesia (<a href="tel:277385400">277 385 400</a>) e, se não for resolvido, escreva à Câmara.</li></ul>'+
 '<p>Guarde sempre os recibos das taxas pagas e o nome da pessoa que o atendeu.</p>',
 c_en:'<p>The municipality’s cemeteries are run by the Câmara, with help from the Junta de Freguesia.</p>'+
 '<ul><li><strong>Applying for or renewing a grave, paying fees, arranging an exhumation:</strong> the Câmara secretariat, <a href="tel:277394106">277 394 106</a>.</li>'+
 '<li><strong>Upkeep, water, gates or paths in poor condition:</strong> start with the Junta de Freguesia (<a href="tel:277385400">277 385 400</a>) and write to the Câmara if nothing is done.</li></ul>'+
 '<p>Always keep receipts for fees paid, and note the name of the person who dealt with you.</p>'},

/* ============ OBRAS E TERRENOS ============ */
{cat:2,
 t_pt:'Que obras posso fazer sem pedir licença à Câmara',
 t_en:'Which work you can do without a permit',
 k_pt:'obras licenca isento pintar telhado caiar reparar pequenas obras arranjar casa',
 k_en:'building work permit licence exempt painting roof whitewash repairs small works',
 c_pt:'<p>Regra geral, <strong>não precisa de licença</strong> para:</p>'+
 '<ul><li><strong>Obras de conservação</strong> — pintar, caiar, arranjar o telhado, substituir telhas, arranjar canalização ou electricidade, sem mudar nada de fora.</li>'+
 '<li><strong>Obras dentro de casa</strong> que não mexam com paredes-mestras nem com a fachada.</li>'+
 '<li><strong>Arrecadações pequenas</strong> — até cerca de 2,2 metros de altura e 10 m², desde que não fiquem viradas para a rua.</li>'+
 '<li><strong>Muros de vedação</strong> baixos, até cerca de 1,8 metros, que não confinem com a via pública.</li>'+
 '<li><strong>Painéis solares</strong> dentro dos limites da lei.</li></ul>'+
 '<div class="aviso"><strong>Atenção:</strong> se a casa estiver em zona de protecção de um monumento ou for um edifício classificado, <strong>precisa sempre de autorização</strong>, mesmo para obras pequenas. Em caso de dúvida, telefone antes: <a href="tel:277394106">277 394 106</a> ou <a href="mailto:serv.obras@cm-penamacor.pt">serv.obras@cm-penamacor.pt</a>. Uma pergunta antes custa cinco minutos; uma obra embargada custa muito mais.</div>'+
 '<p><strong>Perguntar e requerer são coisas diferentes.</strong> Perguntar se precisa de licença — por telefone, por email ou com uma carta escrita aqui no portal — não custa nada e serve para saber o caminho. <strong>Licenciar a obra é outra coisa:</strong> a Câmara tem impressos próprios, uns trinta, e cada um pede os seus papéis — plantas, termos de responsabilidade, projectos assinados por técnico. Estão em <a href="https://www.cm-penamacor.pt/servicos-municipais/obras-e-urbanismo/requerimentos" target="_blank" rel="noopener">cm-penamacor.pt → Obras e Urbanismo → Requerimentos</a>, e para dúvidas no preenchimento a própria Câmara indica o <a href="tel:277394106">277 394 106</a>.</p>'+
 '<p>O serviço de Obras e Urbanismo <strong>não é no edifício da Câmara</strong>: fica no Largo Tenente Coronel Júlio Rodrigues da Silva, o antigo Quartel, e atende de 2.ª a 6.ª das <strong>9h00 às 12h30 e das 14h00 às 16h00</strong> — fecha uma hora e meia antes dos outros serviços.</p>'+
 '<div class="aviso"><strong>Se a obra já está feita e quer legalizá-la</strong>, saiba o que está a fazer antes de escrever. Pedir a legalização é dizer à Câmara, por escrito, que houve obra sem licença — é o caminho certo e é o que se deve fazer, mas passa a haver um papel com essa declaração. <strong>Telefone primeiro</strong> ao serviço e pergunte como se faz no seu caso. Não é para o assustar: é para não ir às cegas.</div>',
 c_en:'<p>As a general rule, <strong>no permit is needed</strong> for:</p>'+
 '<ul><li><strong>Maintenance work</strong> — painting, whitewashing, repairing the roof, replacing tiles, plumbing or wiring, provided nothing changes outside.</li>'+
 '<li><strong>Internal work</strong> that does not touch load-bearing walls or the façade.</li>'+
 '<li><strong>Small outbuildings</strong> — up to about 2.2 m high and 10 m², so long as they do not front onto the street.</li>'+
 '<li><strong>Boundary walls</strong> up to about 1.8 m that do not adjoin the public highway.</li>'+
 '<li><strong>Solar panels</strong> within the limits set by law.</li></ul>'+
 '<div class="aviso"><strong>Important:</strong> if the house sits in the protection zone of a monument, or is a listed building, <strong>you always need consent</strong>, even for small work. Much of the old village centre can fall into this category. If in any doubt, ring first: <a href="tel:277394106">277 394 106</a> or <a href="mailto:serv.obras@cm-penamacor.pt">serv.obras@cm-penamacor.pt</a>. Asking beforehand costs five minutes; a stop notice costs a great deal more.</div>'+
 '<p><strong>Asking and applying are not the same thing.</strong> Asking whether you need consent — by phone, by email, or with a letter written here on the portal — costs nothing and tells you which road to take. <strong>Applying is another matter:</strong> the Câmara has its own forms, around thirty of them, each with its own required papers — drawings, signed technical declarations, projects by a qualified professional. They are at <a href="https://www.cm-penamacor.pt/servicos-municipais/obras-e-urbanismo/requerimentos" target="_blank" rel="noopener">cm-penamacor.pt → Obras e Urbanismo → Requerimentos</a>, and for help filling them in the Câmara itself gives <a href="tel:277394106">277 394 106</a>.</p>'+
 '<p>Obras e Urbanismo — the planning office — <strong>is not in the Câmara building</strong>: it is at Largo Tenente Coronel Júlio Rodrigues da Silva, the old barracks, open Monday to Friday <strong>9.00–12.30 and 14.00–16.00</strong>, an hour and a half earlier than the other services.</p>'+
 '<div class="aviso"><strong>If the work is already done and you want to regularise it</strong>, know what you are doing before you write. Asking for regularisation means telling the Câmara, in writing, that work was carried out without consent — it is the right thing to do, but it puts that statement on record. <strong>Ring the office first</strong> and ask how it works in your case. This is not to frighten you: it is so you do not go in blind.</div>'},

{cat:2,
 t_pt:'Que obras precisam de licença ou de comunicação prévia',
 t_en:'Which work needs a permit or prior notification',
 k_pt:'licenca obra construir ampliar janela porta piscina telhado projeto arquiteto',
 k_en:'permit licence build extension window door swimming pool roof plans architect',
 c_pt:'<p>Precisa de tratar do papel na Câmara <strong>antes</strong> de começar, quando a obra:</p>'+
 '<ul><li>Mexe em paredes-mestras ou na estrutura da casa.</li>'+
 '<li>Muda o aspecto de fora — a fachada, a cor, a forma do telhado.</li>'+
 '<li>Abre janelas ou portas novas.</li><li>Aumenta a casa (mais área ou mais altura).</li>'+
 '<li>Constrói uma piscina.</li>'+
 '<li>Faz um muro virado para a rua ou mais alto do que a lei permite.</li></ul>'+
 '<p><strong>Como se faz:</strong> os formulários estão no site do Município, em <em>Serviços Municipais → Obras e Urbanismo → Requerimentos</em>. Se não usa computador, vá à Câmara e peça o impresso ao balcão — são obrigados a ajudá-lo a preencher.</p>'+
 '<p>Contacto: <a href="tel:277394106">277 394 106</a> · <a href="mailto:serv.obras@cm-penamacor.pt">serv.obras@cm-penamacor.pt</a></p>',
 c_en:'<p>You must deal with the paperwork <strong>before</strong> starting when the work:</p>'+
 '<ul><li>Touches load-bearing walls or the structure.</li>'+
 '<li>Changes the outside appearance — façade, colour, roof shape.</li>'+
 '<li>Creates new windows or doors.</li><li>Extends the house (more floor area or more height).</li>'+
 '<li>Builds a swimming pool.</li>'+
 '<li>Puts up a wall onto the street, or higher than the law allows.</li></ul>'+
 '<p><strong>How:</strong> the forms are on the Câmara website under <em>Serviços Municipais → Obras e Urbanismo → Requerimentos</em>. If you do not use a computer, go to the Câmara offices and ask for the paper form at the counter — staff are required to help you fill it in.</p>'+
 '<p>Contact: <a href="tel:277394106">277 394 106</a> · <a href="mailto:serv.obras@cm-penamacor.pt">serv.obras@cm-penamacor.pt</a></p>'},

{cat:2,
 t_pt:'Limpeza de terrenos — prazos e coimas',
 t_en:'Clearing land — deadlines and fines',
 k_pt:'limpar terreno mato faixa combustivel incendio coima prazo maio proprietario',
 k_en:'clearing land scrub firebreak fuel management wildfire fine deadline may owner',
 c_pt:'<p>Quem é dono, arrendatário ou usufrutuário de um terreno <strong>é obrigado por lei</strong> a cortar o mato e limpar a vegetação, todos os anos, antes do Verão.</p>'+
 '<p><strong>Distâncias a limpar:</strong></p>'+
 '<ul><li><strong>50 metros</strong> à volta de casas isoladas no campo.</li>'+
 '<li><strong>100 metros</strong> à volta de povoações, parques industriais e parques de campismo.</li>'+
 '<li><strong>10 metros</strong> à volta de construções agrícolas (palheiros, arrecadações).</li></ul>'+
 '<p><strong>Prazo:</strong> em 2026 o prazo terminou a <strong>31 de Maio</strong> (com prolongamento até 30 de Junho em concelhos abrangidos por calamidade). <strong>O prazo muda de ano para ano</strong> — confirme sempre na Câmara ou na Junta no início da Primavera.</p>'+
 '<p><strong>Coimas:</strong> de 150 € a 1 500 € para pessoas, podendo subir muito em casos graves. Quem fiscaliza: GNR, ICNF, a Câmara e os vigilantes da natureza.</p>'+
 '<p>Se não conseguir limpar sozinho (idade, saúde, terreno grande), <strong>peça ajuda à Junta antes do prazo</strong> — é muito melhor do que ser notificado depois.</p>',
 c_en:'<p>If you own, rent or hold the usufruct of land, <strong>the law requires you</strong> to cut back scrub and clear vegetation every year, before the summer. This applies to foreign owners exactly as it does to residents, whether or not you are in the country.</p>'+
 '<p><strong>Distances to clear:</strong></p>'+
 '<ul><li><strong>50 metres</strong> around isolated houses in the countryside.</li>'+
 '<li><strong>100 metres</strong> around settlements, industrial estates and campsites.</li>'+
 '<li><strong>10 metres</strong> around agricultural buildings (barns, stores).</li></ul>'+
 '<p><strong>Deadline:</strong> in 2026 it fell on <strong>31 May</strong> (extended to 30 June in municipalities under a declared calamity). <strong>The date changes from year to year</strong> — always check with the Câmara or the Junta de Freguesia in early spring.</p>'+
 '<p><strong>Fines:</strong> €150 to €1,500 for individuals, and much higher in serious cases. Enforcement is by the GNR police, the ICNF forestry institute, the Câmara and nature wardens.</p>'+
 '<p>If you cannot do the work yourself — age, health, a large plot, or because you live abroad — <strong>ask the Junta de Freguesia for help well before the deadline</strong>. Far better than being served notice afterwards.</p>'},

{cat:2,
 t_pt:'O terreno do vizinho está por limpar e faz perigo',
 t_en:'A neighbour’s land is uncleared and poses a risk',
 k_pt:'vizinho terreno sujo mato abandonado perigo incendio dono desconhecido queixa',
 k_en:'neighbour land overgrown abandoned danger fire unknown owner complaint',
 c_pt:'<p>Não tem de resolver isto sozinho nem de discutir com ninguém. É a Câmara que notifica o proprietário.</p>'+
 '<ol><li><strong>Fotografe</strong> o terreno, se possível com a sua casa ou a rua na fotografia, para se ver a distância.</li>'+
 '<li>Escreva à Câmara pelo gerador de cartas deste portal — escolha «Terreno por limpar com perigo de incêndio».</li>'+
 '<li>Diga a rua e, se souber, de quem é o terreno. <strong>Se não souber o dono, diga isso mesmo</strong> — a Câmara tem meios para descobrir.</li>'+
 '<li>Se a Câmara notificar e o dono não limpar, a Câmara pode mandar limpar e cobrar-lhe a despesa.</li></ol>'+
 '<p>Se estiverem muitos vizinhos preocupados, façam <strong>um pedido assinado por todos</strong> — no gerador de cartas há a opção «Somos várias pessoas».</p>',
 c_en:'<p>You do not have to sort this out yourself or fall out with anyone. It is the Câmara that serves notice on the owner.</p>'+
 '<ol><li><strong>Photograph</strong> the land, if possible with your house or the street in shot, so the distance is visible.</li>'+
 '<li>Write to the Câmara using the letter writer — choose «Uncleared land posing a fire risk».</li>'+
 '<li>Give the street and, if you know it, whose land it is. <strong>If you do not know the owner, say so</strong> — the Câmara has ways of finding out.</li>'+
 '<li>If the Câmara serves notice and the owner still does nothing, it can have the land cleared and bill them for it.</li></ol>'+
 '<p>If several neighbours are worried, submit <strong>one request signed by all of you</strong> — the letter writer has a «Several of us» option.</p>'},

{cat:2,
 t_pt:'Fazer uma queimada ou queimar mato cortado',
 t_en:'Burning cut scrub, or burning off land',
 k_pt:'queima queimada fogo mato lume autorizacao icnf fogueira restolho',
 k_en:'burning fire scrub bonfire authorisation permission icnf stubble',
 c_pt:'<p>São duas coisas diferentes, e ambas precisam de autorização:</p>'+
 '<ul><li><strong>Queima</strong> — arder um montinho de ramos e mato cortado (até cerca de 4 m² de base e 1,3 m de altura).</li>'+
 '<li><strong>Queimada</strong> — deitar fogo a uma área de terreno, para renovar pasto ou limpar.</li></ul>'+
 '<p><strong>Como se pede:</strong> pela plataforma ou aplicação do ICNF, ou na Junta de Freguesia, que o pode ajudar a fazer o pedido. A resposta chega por SMS ou email.</p>'+
 '<div class="aviso urgente"><strong>Nunca queime nada</strong> em dia de risco de incêndio elevado ou máximo, nem com vento. As coimas vão de 500 € a 5 000 € e, se o fogo se espalhar, há crime. Em caso de dúvida, ligue à linha <strong>Portugal Chama</strong>: <a href="tel:808200520">808 200 520</a> (todos os dias, das 8h às 21h).</div>'+
 '<p><strong>Alternativa sem risco:</strong> em vez de queimar, peça à Junta informação sobre estilhaçamento ou recolha do material cortado.</p>',
 c_en:'<p>Two different things, and both need permission:</p>'+
 '<ul><li><strong>Queima</strong> — burning a heap of cut branches and scrub (up to roughly 4 m² at the base and 1.3 m high).</li>'+
 '<li><strong>Queimada</strong> — setting fire to an area of land, to renew pasture or clear it.</li></ul>'+
 '<p><strong>How to apply:</strong> through the ICNF forestry platform or app, or at the Junta de Freguesia, who can help you make the request. The answer comes by text message or email.</p>'+
 '<div class="aviso urgente"><strong>Never burn anything</strong> on a day of high or maximum fire risk, or in wind. Fines run from €500 to €5,000, and if the fire spreads it becomes a criminal matter. If in doubt, ring the <strong>Portugal Chama</strong> line: <a href="tel:808200520">808 200 520</a> (daily, 8 am to 9 pm).</div>'+
 '<p><strong>Safer alternative:</strong> instead of burning, ask the Junta de Freguesia about chipping or collection of the cut material.</p>'},

{cat:2,
 t_pt:'Ocupar a rua durante uma obra (andaimes, areia, contentor)',
 t_en:'Using the street during building work (scaffolding, sand, skip)',
 k_pt:'ocupacao via publica andaime obra areia contentor entulho estacionar rua',
 k_en:'street occupation scaffolding building work sand skip rubble parking road',
 c_pt:'<p>Se a obra ocupa passeio ou rua — andaimes, monte de areia, contentor de entulho, camião parado — precisa de <strong>licença de ocupação da via pública</strong>, pedida na Câmara antes de começar.</p>'+
 '<ol><li>Peça o formulário na Câmara ou no site (<em>Obras e Urbanismo → Requerimentos</em>).</li>'+
 '<li>Diga quantos dias vai ocupar e que espaço.</li>'+
 '<li>Paga-se uma taxa, normalmente por metro e por dia.</li></ol>'+
 '<p>Normalmente é o empreiteiro que trata disto — <strong>mas confirme com ele</strong>, porque a coima cai sobre o dono da obra.</p>',
 c_en:'<p>If the work takes up pavement or road — scaffolding, a pile of sand, a skip, a lorry standing — you need a <strong>street occupation licence</strong>, applied for at the Câmara before work starts.</p>'+
 '<ol><li>Ask for the form at the Câmara or on the website (<em>Obras e Urbanismo → Requerimentos</em>).</li>'+
 '<li>State how many days and how much space.</li>'+
 '<li>There is a fee, usually charged per metre per day.</li></ol>'+
 '<p>The builder normally handles this — <strong>but check that he has</strong>, because the fine lands on the owner of the works.</p>'},

/* ============ APOIOS E SAÚDE ============ */
{cat:3,
 t_pt:'Cartão Penamacor Social — descontos para maiores de 60 anos',
 t_en:'Penamacor Social Card — discounts for the over-60s',
 k_pt:'cartao social idoso 60 anos desconto piscina transporte gratis incapacidade',
 k_en:'social card senior over 60 discount pool transport free incapacity disability',
 c_pt:'<p>É <strong>gratuito</strong> e dá direito a descontos em serviços do Município.</p>'+
 '<p><strong>Quem pode pedir:</strong> quem tiver <strong>60 anos ou mais</strong>, ou quem tenha atestado médico de incapacidade de 60% ou mais.</p>'+
 '<p><strong>O que dá:</strong></p>'+
 '<ul><li>Transporte entre freguesias <strong>de graça</strong>.</li>'+
 '<li>25% a 50% de desconto nas piscinas, ginásio e estádio municipais.</li>'+
 '<li>25% de desconto em termas, espectáculos culturais e publicações do Município.</li>'+
 '<li>10% de desconto em fotocópias e impressões.</li></ul>'+
 '<p><strong>Como pedir:</strong> preencha o formulário (pede-se na Câmara ou descarrega-se do site) e leve o cartão de cidadão e um comprovativo de morada à Unidade de Educação, Ação Social e Saúde, na Rua dos Bombeiros Voluntários, em Penamacor — de segunda a sexta, das 9h00 às 12h30 e das 14h00 às 16h00.</p>'+
 '<p>Informações: <a href="tel:277394040">277 394 040</a> · <a href="mailto:gab.social@cm-penamacor.pt">gab.social@cm-penamacor.pt</a></p>',
 c_en:'<p>It is <strong>free</strong> and gives discounts on Câmara services.</p>'+
 '<p><strong>Who can apply:</strong> anyone <strong>aged 60 or over</strong>, or holding a certificate of medical incapacity of 60% or more.</p>'+
 '<p><strong>What it gives:</strong></p>'+
 '<ul><li><strong>Free</strong> transport between parishes.</li>'+
 '<li>25–50% off the municipal pools, gym and stadium.</li>'+
 '<li>25% off the thermal spa, cultural events and Câmara publications.</li>'+
 '<li>10% off photocopying and printing.</li></ul>'+
 '<p><strong>How to apply:</strong> fill in the form (available at the Câmara or from its website) and take it, with your ID and proof of address, to the Education, Social Action and Health Unit on Rua dos Bombeiros Voluntários in Penamacor — Monday to Friday, 9.00–12.30 and 14.00–16.00.</p>'+
 '<p>Information: <a href="tel:277394040">277 394 040</a> · <a href="mailto:gab.social@cm-penamacor.pt">gab.social@cm-penamacor.pt</a></p>'},

{cat:3,
 t_pt:'Ajuda para pagar medicamentos (Programa abem)',
 t_en:'Help with the cost of medicines (the abem programme)',
 k_pt:'medicamentos farmacia abem comparticipacao remedios caro receita apoio',
 k_en:'medicines pharmacy abem prescription chemist cost support subsidy',
 c_pt:'<p>O Município tem protocolo com o <strong>Programa abem: Rede Solidária do Medicamento</strong>, que permite levantar na farmácia, <strong>sem pagar</strong>, os medicamentos receitados e comparticipados.</p>'+
 '<ol><li>Fale com a Ação Social do Município: <a href="tel:277394040">277 394 040</a> ou <a href="mailto:gab.social@cm-penamacor.pt">gab.social@cm-penamacor.pt</a>.</li>'+
 '<li>Explicam-lhe as condições e ajudam a preencher a candidatura.</li>'+
 '<li>Se for aprovado, recebe um cartão que apresenta na farmácia.</li></ol>'+
 '<p>Há também apoio do Município para <strong>outras despesas de saúde</strong> — pergunte no mesmo sítio.</p>',
 c_en:'<p>The Câmara has an agreement with the <strong>abem: Rede Solidária do Medicamento</strong> scheme, which lets you collect prescribed, state-subsidised medicines at the pharmacy <strong>without paying</strong>.</p>'+
 '<ol><li>Speak to the Câmara’s social action team: <a href="tel:277394040">277 394 040</a> or <a href="mailto:gab.social@cm-penamacor.pt">gab.social@cm-penamacor.pt</a>.</li>'+
 '<li>They will explain the conditions and help you complete the application.</li>'+
 '<li>If approved, you receive a card to show at the pharmacy.</li></ol>'+
 '<p>The Câmara also helps with <strong>other health costs</strong> — ask at the same place.</p>'},

{cat:3,
 t_pt:'Apoio para arranjar a casa',
 t_en:'Help with repairs to your home',
 k_pt:'habitacao casa telhado obras apoio carenciado subsidio reparar arranjar',
 k_en:'housing home roof repairs support grant low income damp',
 c_pt:'<p>O Município tem um regulamento de apoio à habitação para famílias com dificuldades económicas — para obras de melhoria das condições da casa.</p>'+
 '<ol><li>Peça o boletim de candidatura na Câmara.</li>'+
 '<li>Contacto: <a href="tel:277394106">277 394 106</a> · <a href="mailto:secretaria.gap@cm-penamacor.pt">secretaria.gap@cm-penamacor.pt</a>.</li>'+
 '<li>Junte fotografias do que está mau — telhado, humidade, casa de banho — e um orçamento, se conseguir.</li></ol>'+
 '<p>Se não conseguir tratar disto sozinho, peça à Junta de Freguesia que o acompanhe. É para isso que lá está.</p>',
 c_en:'<p>The Câmara has a housing support scheme for households in financial difficulty, covering work to improve living conditions.</p>'+
 '<ol><li>Ask for the application form at the Câmara.</li>'+
 '<li>Contact: <a href="tel:277394106">277 394 106</a> · <a href="mailto:secretaria.gap@cm-penamacor.pt">secretaria.gap@cm-penamacor.pt</a>.</li>'+
 '<li>Include photographs of what is wrong — roof, damp, bathroom — and a builder’s estimate if you can get one.</li></ol>'+
 '<p>If you cannot manage the paperwork alone, ask the Junta de Freguesia to help you through it. That is what they are there for.</p>'},

{cat:3,
 t_pt:'Centro de Saúde e marcação de consultas',
 t_en:'The health centre and booking appointments',
 k_pt:'centro saude medico consulta marcar receita enfermeiro sns analises avc',
 k_en:'health centre doctor appointment prescription nurse sns tests stroke emergency',
 c_pt:'<ul><li><strong>Centro de Saúde de Penamacor:</strong> <a href="tel:277390020">277 390 020</a> · telemóveis <a href="tel:935970044">935 970 044</a> e <a href="tel:933950075">933 950 075</a></li>'+
 '<li><strong>SNS 24</strong> (dúvidas de saúde, 24 horas por dia): <a href="tel:808242424">808 24 24 24</a>. Antes de ir às urgências, ligue — poupa-lhe a viagem muitas vezes.</li>'+
 '<li><strong>Emergência</strong> (acidente, dor no peito, falta de ar, sinais de AVC): <a href="tel:112">112</a>, sempre.</li></ul>'+
 '<p><strong>Sinais de AVC — não espere:</strong> boca ao lado, um braço sem força, fala confusa. Ligue <a href="tel:112">112</a> e diga a hora a que começou.</p>',
 c_en:'<ul><li><strong>Penamacor Health Centre:</strong> <a href="tel:277390020">277 390 020</a> · mobiles <a href="tel:935970044">935 970 044</a> and <a href="tel:933950075">933 950 075</a></li>'+
 '<li><strong>SNS 24</strong> (health advice, 24 hours a day): <a href="tel:808242424">808 24 24 24</a>. English is not always available, but ring before setting off for A&amp;E — it often saves the journey.</li>'+
 '<li><strong>Emergency</strong> (accident, chest pain, breathlessness, signs of stroke): <a href="tel:112">112</a>, always. Ask for English and they will try to connect an interpreter.</li></ul>'+
 '<p><strong>Signs of a stroke — do not wait:</strong> face drooping on one side, weakness in one arm, slurred speech. Ring <a href="tel:112">112</a> and say what time it started.</p>'},

{cat:3,
 t_pt:'Onde pedir ajuda quando ninguém responde',
 t_en:'Where to turn when nobody replies',
 k_pt:'ajuda queixa reclamacao provedor idoso direitos linha apoio ninguem responde',
 k_en:'help complaint ombudsman senior rights helpline nobody replies appeal',
 c_pt:'<p>Se fez o pedido, esperou, insistiu e continua sem resposta:</p>'+
 '<ul><li><strong>Linha do Cidadão Idoso</strong> (Provedor de Justiça) — gratuita, dias úteis das 9h30 às 17h30: <a href="tel:800203531">800 20 35 31</a>. Ajudam a perceber os seus direitos e a pôr a queixa no sítio certo.</li>'+
 '<li><strong>Provedor de Justiça</strong> — <a href="https://www.provedor-jus.pt" target="_blank" rel="noopener">provedor-jus.pt</a>. É gratuito e trata de queixas contra serviços públicos, incluindo câmaras municipais.</li>'+
 '<li><strong>Livro de Reclamações Eletrónico</strong> — <a href="https://www.livroreclamacoes.pt" target="_blank" rel="noopener">livroreclamacoes.pt</a>. Também pode pedir o livro em papel ao balcão de qualquer serviço público.</li>'+
 '<li><strong>Assembleia Municipal</strong> — as reuniões são públicas e há um período aberto ao público. Qualquer morador pode ir e falar. Pergunte na Câmara quando é a próxima.</li></ul>'+
 '<p>Leve sempre <strong>cópias de tudo o que enviou e as datas</strong>. É isso que dá força à queixa.</p>',
 c_en:'<p>If you have made the request, waited, chased it and still heard nothing:</p>'+
 '<ul><li><strong>Senior Citizen’s Line</strong> (Ombudsman) — free, weekdays 9.30 am to 5.30 pm: <a href="tel:800203531">800 20 35 31</a>. They explain your rights and point the complaint to the right place.</li>'+
 '<li><strong>The Ombudsman (Provedor de Justiça)</strong> — <a href="https://www.provedor-jus.pt" target="_blank" rel="noopener">provedor-jus.pt</a>. Free, and handles complaints against public bodies, municipal councils included.</li>'+
 '<li><strong>Electronic Complaints Book</strong> — <a href="https://www.livroreclamacoes.pt" target="_blank" rel="noopener">livroreclamacoes.pt</a>. You can also ask for the paper book at the counter of any public service.</li>'+
 '<li><strong>The Municipal Assembly</strong> — meetings are public and include a period open to the floor. Any resident may attend and speak. Ask at the Câmara when the next one is.</li></ul>'+
 '<p>Always take <strong>copies of everything you sent, with dates</strong>. That is what gives a complaint its weight.</p>'}
];

/* ------------------------------------------------------------------
   O formulário acompanha o assunto escolhido — D-019.
   Três coisas mudam: a cópia à Junta, as perguntas 6 e 7, e se há
   sequer carta a escrever. Um pedido de apoio social não tem local
   nem «desde quando», e não se dirige ao Presidente.
------------------------------------------------------------------ */
function assuntoActual(){
  var sel=document.getElementById('assunto');
  var r=ASSUNTOS.filter(function(x){return x.id===sel.value;});
  return r[0]||ASSUNTOS[0];
}

function mudouAssunto(){
  var a=assuntoActual();
  var enc=document.getElementById('encaminha');
  var campos=document.getElementById('camposCarta');
  if(!enc||!campos) return;

  /* assunto que não se resolve por carta: mostra-se o caminho certo */
  if(a.guia){
    enc.innerHTML=t('enc_apoio')+
      '<div class="botoes" style="margin-top:.8rem"><button class="btn btn-2" onclick="abrir(\'glossario\')">'+
      t('enc_botao')+'</button></div>';
    enc.classList.remove('hidden');
    campos.classList.add('hidden');
    return;
  }
  enc.classList.add('hidden');
  campos.classList.remove('hidden');

  /* nota do assunto: diz o que a carta não faz, antes de a pessoa escrever */
  var nt=document.getElementById('notaAssunto');
  if(nt){
    if(a.nota){ nt.innerHTML=t(a.nota); nt.classList.remove('hidden'); }
    else nt.classList.add('hidden');
  }

  /* a cópia à Junta segue o assunto, nunca vem marcada de fábrica */
  var ck=document.getElementById('junta');
  if(ck && !ck.dataset.tocado) ck.checked = (a.junta===true);

  /* pergunta 6: «onde é o problema» só faz sentido numa queixa */
  var lbl=document.querySelector('#campoLocal [data-i18n]');
  var dica=document.querySelector('#campoLocal .dica');
  var inp=document.getElementById('local');
  var chaveL=(a.tipo==='pedido')?'q6_pedido':'q6';
  var chaveD=(a.tipo==='pedido')?'q6d_pedido':'q6d';
  var chaveP=(a.tipo==='pedido')?'q6p_pedido':'q6p';
  if(lbl){ lbl.setAttribute('data-i18n',chaveL); lbl.innerHTML=t(chaveL); }
  if(dica){ dica.setAttribute('data-i18n',chaveD); dica.innerHTML=t(chaveD); }
  if(inp){ inp.setAttribute('data-i18n-ph',chaveP); inp.placeholder=t(chaveP); }

  /* pergunta 7: «desde quando» é de queixa e de mais nada */
  var d=document.getElementById('campoDesde');
  if(d){
    if(a.tipo==='queixa') d.classList.remove('hidden');
    else { d.classList.add('hidden'); if(document.getElementById('desde')) document.getElementById('desde').value=''; }
  }

  renumerar();
  esconderAvisoLocal();
}

/* Os números das perguntas contam-se ao ecrã, não estão escritos.
   Com a pergunta 7 escondida, saltar de «6.» para «8.» faria uma
   pessoa procurar a que falta. D-019 */
function renumerar(){
  var campos=['assunto','nome','morada','telefone','email','local','desde','descricao'];
  var n=0;
  campos.forEach(function(id){
    var caixa=document.getElementById(id);
    if(!caixa) return;
    if(id==='local' && document.getElementById('campoLocal').classList.contains('hidden')) return;
    if(id==='desde' && document.getElementById('campoDesde').classList.contains('hidden')) return;
    n++;
    var lbl=document.querySelector('label[for="'+id+'"] span[data-i18n]');
    if(lbl) lbl.innerHTML = lbl.innerHTML.replace(/^\s*\d+\.\s*/, n+'. ');
  });
}

function semAcentos(s){
  return s.normalize ? s.normalize('NFD').replace(/[\u0300-\u036f]/g,'') : s;
}

function filtrar(){
  var lista=document.getElementById('listaGlossario');
  var q=semAcentos((document.getElementById('busca').value||'').toLowerCase().trim());
  var visiveis=0;
  Array.prototype.forEach.call(lista.children,function(d){
    var txt=semAcentos(d.dataset.txt);
    var okCat=(catActiva==='todas'||String(d.dataset.cat)===String(catActiva));
    var okQ=(!q||txt.indexOf(q)>-1);
    var ver=okCat&&okQ;
    d.style.display=ver?'':'none';
    if(!ver) d.open=false;
    if(ver) visiveis++;
  });
  document.getElementById('semResultado').classList.toggle('hidden', visiveis>0);
}

function buscarNoticias(){

    })

/* "há 2 horas", "ontem", "há 3 dias" — mais fácil de ler do que uma data */
function haQuantoTempo(iso){
  if(!iso) return '';
  var d=new Date(iso.length<=10 ? iso+'T12:00:00' : iso);
  if(isNaN(d)) return '';
  var min=Math.round((Date.now()-d.getTime())/60000);
  if(min<2)    return t('agora');
  if(min<60)   return t('ha_min').replace('{n}',min);
  var h=Math.round(min/60);
  if(h<24)     return t('ha_horas').replace('{n}',h);
  var dias=Math.round(h/24);
  if(dias===1) return t('ontem');
  if(dias<7)   return t('ha_dias').replace('{n}',dias);
  var MESES=t('meses');
  return d.getDate()+t('festas_de')+MESES[d.getMonth()];
}

function eRecente(iso, horas){
  if(!iso) return false;
  var d=new Date(iso.length<=10 ? iso+'T12:00:00' : iso);
  if(isNaN(d)) return false;
  return (Date.now()-d.getTime()) < horas*3600000;
}

/* =========================================================
   AGENDA CULTURAL
   Três fontes, juntas numa lista só:
     1. as romarias fixas deste ficheiro — nunca falham, funcionam
        sem rede e repetem-se todos os anos;
     2. o Google Calendar público do concelho;
     3. a agenda cultural do site da Câmara.
   As duas últimas chegam pelo Worker (CONFIG.API + '/agenda').
   Sem rede ou sem Worker, ficam as primeiras — a agenda nunca
   aparece vazia.
   ========================================================= */

var EVENTOS_REMOTOS = null;   /* o que veio do Worker nesta sessão */
var ESTADO_AGENDA = 'inicio'; /* inicio | a-carregar | pronto | falhou */
var EVENTO_ABERTO = null;

function urlAPI(caminho){
  if(!CONFIG.API) return '';
  return CONFIG.API.replace(/\/+$/,'') + caminho;
}

/* ---- normalizar as romarias fixas ---- */
function eventosFixos(){
  var hoje=new Date(), mesHoje=hoje.getMonth()+1, anoHoje=hoje.getFullYear();
  return FESTAS.map(function(f,i){
    var ano=(!f.fixo && f.m<mesHoje)?anoHoje+1:anoHoje;
    return {
      chave:'fixo:'+i,
      titulo:f.nome,
      local:(LANG==='en'&&f.local_en)?f.local_en:f.local,
      mapa:f.mapa, mapaNome:f.mapaNome,
      descricao:(LANG==='pt'?f.o_pt:f.o_en)||'',
      ano:ano, mes:f.m, dia:f.d||'', hora:null,
      dataISO: f.d ? (ano+'-'+String(f.m).padStart(2,'0')+'-'+String(f.d).padStart(2,'0')) : null,
      fixo:!!f.fixo, nossa:!!f.nossa, fonte:'fixo', link:'', imagem:''
    };
  });
}

/* ---- normalizar o que vem do Worker ---- */
function eventoRemoto(e){
  var d = (e.data||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return {
    chave: e.id || ('rem:'+(e.titulo||'').slice(0,40)),
    titulo: e.titulo||'',
    local: e.local||'',
    mapa: e.mapa || e.local || 'Penamacor',
    mapaNome: (e.local||'Penamacor').split(',')[0].slice(0,32),
    descricao: e.descricao||'',
    ano: d?parseInt(d[1],10):null,
    mes: d?parseInt(d[2],10):null,
    dia: d?String(parseInt(d[3],10)):'',
    hora: e.hora||null,
    dataISO: d?e.data:null,
    dataFimISO: e.dataFim||null,
    fixo:false, nossa:false,
    fonte: e.fonte||'agenda',
    link: e.link||'', imagem: e.imagem||''
  };
}

function buscarAgenda(){
  if(!urlAPI('/agenda')) return Promise.resolve(null);
  var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  var relogio=setTimeout(function(){ if(ctrl) ctrl.abort(); }, 12000);
  return fetch(urlAPI('/agenda'), {signal:ctrl?ctrl.signal:undefined})
    .then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); })
    .then(function(j){
      clearTimeout(relogio);
      return (j&&j.eventos&&j.eventos.length)?j.eventos.map(eventoRemoto):[];
    })
    .catch(function(){ clearTimeout(relogio); return null; });
}

function todosOsEventos(){
  var lista=eventosFixos();
  if(EVENTOS_REMOTOS && EVENTOS_REMOTOS.length) lista=lista.concat(EVENTOS_REMOTOS);
  return lista;
}

function desenharAgenda(){
  var caixa=document.getElementById('listaAgenda');
  if(!caixa) return;
  fecharEvento(true);
  caixa.innerHTML='';

  /* primeira vez: pede ao Worker e volta a desenhar quando chegar */
  if(ESTADO_AGENDA==='inicio' && urlAPI('/agenda')){
    ESTADO_AGENDA='a-carregar';
    buscarAgenda().then(function(evs){
      EVENTOS_REMOTOS=evs;
      ESTADO_AGENDA=(evs===null)?'falhou':'pronto';
      desenharAgenda();
    });
  }

  var MESES=t('meses'), MESCURTO=t('mescurto');
  var mesHoje=new Date().getMonth()+1, anoHoje=new Date().getFullYear();
  var lista=todosOsEventos();

  if(ESTADO_AGENDA==='a-carregar'){
    var carregando=document.createElement('p');
    carregando.className='estado';
    carregando.innerHTML='<span class="girar">⏳</span> '+t('agenda_a_carregar');
    caixa.appendChild(carregando);
  }
  if(ESTADO_AGENDA==='falhou'){
    var falhou=document.createElement('p');
    falhou.className='estado mau'; falhou.innerHTML=t('agenda_falhou');
    caixa.appendChild(falhou);
  }

  /* sempre no topo: os que se repetem todos os meses */
  lista.filter(function(e){return e.fixo;}).forEach(function(e){ caixa.appendChild(cartaoEvento(e,MESCURTO)); });

  /* meses, a partir do actual, dando a volta ao ano */
  var ordem=[]; for(var k=0;k<12;k++){ ordem.push(((mesHoje-1+k)%12)+1); }
  var jaMostrados={};
  ordem.forEach(function(m){
    var doMes=lista.filter(function(e){ return !e.fixo && e.mes===m; })
                   .sort(function(a,b){
                     return String(a.dataISO||'9999').localeCompare(String(b.dataISO||'9999'));
                   });
    if(!doMes.length) return;
    var ano=(m<mesHoje)?anoHoje+1:anoHoje;
    var h=document.createElement('h3'); h.className='mesbloco';
    h.textContent=MESES[m-1]+t('festas_de')+ano+(m===mesHoje?t('festas_estemes'):'');
    caixa.appendChild(h);
    doMes.forEach(function(e){
      if(jaMostrados[e.chave]) return;
      jaMostrados[e.chave]=1;
      caixa.appendChild(cartaoEvento(e,MESCURTO));
    });
  });

  /* eventos sem data que se consiga ler */
  var semData=lista.filter(function(e){ return !e.fixo && !e.mes; });
  if(semData.length){
    var h2=document.createElement('h3'); h2.className='mesbloco';
    h2.textContent=t('agenda_sem_data');
    caixa.appendChild(h2);
    semData.forEach(function(e){ caixa.appendChild(cartaoEvento(e,MESCURTO)); });
  }
}

function etiquetaFonte(e){
  if(e.fonte==='camara') return '<span class="tag fonte-cm">'+t('fonte_camara')+'</span>';
  if(e.fonte==='agenda') return '<span class="tag fonte-ag">'+t('fonte_agenda')+'</span>';
  return '<span class="tag">'+t('fonte_fixo')+'</span>';
}

function cartaoEvento(e,MESCURTO){
  var el=document.createElement('button');
  el.type='button';
  el.className='festa'+(e.nossa?' destaque':'');
  el.onclick=function(){ abrirEvento(e.chave); };
  var diaHtml=e.fixo
    ? '<span class="dia pequeno">'+t('fixo_dia')+'</span>'
    : '<span class="dia">'+(e.dia||'—')+'</span>';
  var mesLbl=e.fixo?t('fixo_mes'):(e.mes?MESCURTO[e.mes-1]:'—');
  el.innerHTML=

/* ---------- adicionar à agenda do telemóvel ---------- */
function paraICS(dataISO,hora){
  var d=dataISO.replace(/-/g,'');
  return hora ? d+'T'+hora.replace(':','')+'00' : d;
}
function diaSeguinte(dataISO){
  var p=dataISO.split('-');
  var dt=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  dt.setUTCDate(dt.getUTCDate()+1);
  return dt.toISOString().slice(0,10);
}

function textoICS(e){
  var agora=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  var l=[];
  l.push('BEGIN:VCALENDAR');
  l.push('VERSION:2.0');
  l.push('PRODID:-//Portal da Aldeia de Joao Pires//PT');
  l.push('CALSCALE:GREGORIAN');
  l.push('BEGIN:VEVENT');
  l.push('UID:'+e.chave.replace(/[^A-Za-z0-9:-]/g,'')+'@aldeiajoaopires');
  l.push('DTSTAMP:'+agora);
  if(e.hora){
    /* hora "flutuante": sem fuso horário. É o que faz sentido para uma
       festa da terra — às 21h00 é às 21h00, esteja o telemóvel onde estiver.
       Evita ter de incluir um bloco VTIMEZONE, que alguns telemóveis rejeitam. */
    l.push('DTSTART:'+paraICS(e.dataISO,e.hora));
    var fim=('0'+((parseInt(e.hora.slice(0,2),10)+2)%24)).slice(-2)+e.hora.slice(2);
    l.push('DTEND:'+paraICS(e.dataISO,fim));
  } else {
    l.push('DTSTART;VALUE=DATE:'+paraICS(e.dataISO));
    l.push('DTEND;VALUE=DATE:'+paraICS(diaSeguinte(e.dataFimISO||e.dataISO)));
  }
  l.push('SUMMARY:'+escaparICS(e.titulo));
  if(e.local) l.push('LOCATION:'+escaparICS(e.local));
  var desc=e.descricao||'';
  if(e.link) desc+=(desc?'\n\n':'')+e.link;
  if(desc) l.push('DESCRIPTION:'+escaparICS(desc));
  l.push('END:VEVENT');
  l.push('END:VCALENDAR');
  return l.join('\r\n');
}
function escaparICS(s){
  return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;')
    .replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
}

function baixarICS(){
  if(!EVENTO_ABERTO) return;
  var e=EVENTO_ABERTO;
  var bruto=String(e.titulo||'evento');
  if(bruto.normalize) bruto=bruto.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  var nome=bruto.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'evento';
  var blob=new Blob([textoICS(e)],{type:'text/calendar;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=nome+'.ics';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
}

function linkGoogleAgenda(e){
  var d1,d2;
  if(e.hora){
    d1=paraICS(e.dataISO,e.hora);
    var fim=('0'+((parseInt(e.hora.slice(0,2),10)+2)%24)).slice(-2)+e.hora.slice(2);
    d2=paraICS(e.dataISO,fim);
  } else {
    d1=paraICS(e.dataISO);
    d2=paraICS(diaSeguinte(e.dataFimISO||e.dataISO));
  }
  var q='https://calendar.google.com/calendar/render?action=TEMPLATE'+
    '&text='+encodeURIComponent(e.titulo)+
    '&dates='+d1+'/'+d2+
    '&ctz=Europe/Lisbon'+
    '&details='+encodeURIComponent((e.descricao||'')+(e.link?'\n\n'+e.link:''))+
    '&location='+encodeURIComponent(e.local||e.mapa||'Penamacor');
  return q;
}

function partilhar(){
  if(!EVENTO_ABERTO) return;
  var e=EVENTO_ABERTO;
  var texto=e.titulo+(e.dataISO?' — '+e.dia+'/'+e.mes+'/'+e.ano:'')+
            (e.local?'\n'+e.local:'')+(e.link?'\n'+e.link:'');
  if(navigator.share){
    navigator.share({title:e.titulo, text:texto}).catch(function(){});
  } else if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(function(){ alert(t('partilha_copiada')); },function(){});
  }
}
