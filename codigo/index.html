/* =========================================================
   GERAR A CARTA
   A carta é SEMPRE em português — é a língua da Câmara.
   O corpo pode vir de duas fontes:
     1) do assistente de escrita (CONFIG.API), ou
     2) do modelo escrito à mão, se a API falhar ou não estiver
        configurada. O utilizador nunca fica sem carta.
   Dados pessoais (nome, morada, telefone, email) NUNCA são
   enviados para lado nenhum — são juntos aqui, no aparelho de quem escreve.
   ========================================================= */
function v(id){return document.getElementById(id).value.trim();}

function recolher(){
  var sel=document.getElementById('assunto');
  return {
    a: ASSUNTOS.filter(function(x){return x.id===sel.value;})[0],
    nome:   v('nome')   || (LANG==='pt'?'[o seu nome]':'[your name]'),
    morada: v('morada') || (LANG==='pt'?'[a sua morada]':'[your address]'),
    tel:    v('telefone'),
    mail:   v('email'),
    local:  v('local'),
    desde:  v('desde'),
    desc:   v('descricao') || (LANG==='pt'?'[descreva aqui o que se passa]':'[describe what is happening]'),
    junta:  document.getElementById('junta').checked,
    fotos:  document.getElementById('fotos').checked,
    grupo:  document.getElementById('grupo').checked
  };
}

/* ---- corpo escrito pelo modelo (sem internet) ---- */
function corpoModelo(d){
  /* Numeração calculada, não escrita à mão: sem local não há
     parágrafo de local, e os pontos seguintes não saltam números.
     Antes escrevia-se sempre «A situação verifica-se em …», o que
     obrigava a inventar um sítio em assuntos que não têm sítio. D-019 */
  var pontos=[];
  var p1=d.desc; if(!/[.!?]$/.test(p1)) p1+='.';
  pontos.push(p1);

  if(d.local){
    var p2=(d.a.tipo==='pedido')
      ? 'O presente pedido diz respeito a '+d.local
      : 'A situação verifica-se em '+d.local;
    if(d.desde) p2+=', '+d.desde;
    pontos.push(p2+'.');
  } else if(d.desde){
    pontos.push('A situação verifica-se '+d.desde+'.');
  }

  if(d.a.tipo==='pedido'){
    pontos.push('Trata-se de matéria da competência do Município, pelo que se solicita a informação necessária para que o requerido possa ser tratado nos termos devidos.');
  } else {
    pontos.push('Trata-se de uma matéria da competência do Município, com impacto directo nas condições de vida e na segurança da população desta localidade.');
  }

  if(d.fotos) pontos.push('Junta-se fotografia(s) do local, que documentam o exposto.');

  var c='';
  for(var i=0;i<pontos.length;i++) c+=(i+1)+'. '+pontos[i]+'\n\n';
  c+='Nestes termos, solicita-se a V. Exa. '+d.a.pedido+', bem como a indicação do prazo previsto para '+
     (d.a.tipo==='pedido'?'a resposta':'a intervenção')+'.';
  return c;
}

/* ---- juntar cabeçalho, corpo e assinatura ---- */
function montarCarta(d,corpo){
  var hoje=new Date();
  var mesesPT=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var x='';
  x+='Exmo. Senhor\nPresidente da Câmara Municipal de Penamacor\nLargo do Município\n6090-543 Penamacor\n';
  /* A exposição é sempre dirigida ao Presidente — é o órgão competente e é
     quem dirige a instrução do procedimento. A linha «Ao cuidado de» não muda
     isso: encaminha para quem trata, sem inverter a hierarquia. D-021 */
  if(d.a.aoCuidado) x+='Ao cuidado da '+d.a.aoCuidado+'\n';
  x+='\n';
  if(d.junta) x+='Com conhecimento à União de Freguesias de Aldeia do Bispo, Águas e Aldeia de João Pires\n\n';
  x+='Aldeia de João Pires, '+hoje.getDate()+' de '+mesesPT[hoje.getMonth()]+' de '+hoje.getFullYear()+'\n\n';
  x+='Assunto: '+d.a.linha+' — Aldeia de João Pires\n\n';
  x+='Exmo. Senhor Presidente,\n\n';
  x+=(d.grupo
      ? d.nome+', residente em '+d.morada+', em nome próprio e dos restantes moradores abaixo assinados,'
      : d.nome+', residente em '+d.morada+',')
     +' vem por este meio expor a V. Exa. o seguinte:\n\n';
  x+=corpo.replace(/\s+$/,'')+'\n\n';
  x+='Mais se solicita que seja dada resposta escrita a este pedido, para a morada ou contacto abaixo indicados.\n\n';
  x+='Com os melhores cumprimentos,\n\n'+d.nome+'\n'+d.morada+'\n';
  if(d.tel)  x+='Telefone: '+d.tel+'\n';
  if(d.mail) x+='Email: '+d.mail+'\n';
  if(d.grupo){
    x+='\n\n— — — — — — — — — — — — — — — — — — — —\nOutros moradores subscritores (nome e assinatura):\n\n';
    for(var i=1;i<=5;i++) x+=i+'. ______________________________________________\n\n';
  }
  return x;
}

/* ---- pedir o texto ao assistente ---- */
function pedirTexto(d){
  if(!CONFIG.API) return Promise.resolve(null);

  var ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  var relogio = setTimeout(function(){ if(ctrl) ctrl.abort(); }, CONFIG.TEMPO_LIMITE||25000);

  var carga = {
    assunto:  d.a.id,
    tipo:     d.a.tipo||'queixa',
    rubrica:  d.a.linha,    /* linha de "Assunto:" da carta */
    pedido:   d.a.pedido,   /* o que se pede, em linguagem formal */
    descricao:d.desc.slice(0,1500),
    local:    d.local.slice(0,200),
    desde:    d.desde.slice(0,120),
    fotos:    d.fotos,
    grupo:    d.grupo
  };

  return fetch(urlAPI('/carta'), {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(carga),
    signal: ctrl?ctrl.signal:undefined
  })
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(j){
    clearTimeout(relogio);
    var c = j && j.corpo ? String(j.corpo).trim() : '';
    /* segurança: se vier vazio ou absurdamente curto, usa-se o modelo */
    return c.length > 60 ? c : null;
  })
  .catch(function(){ clearTimeout(relogio); return null; });
}

/* ---- o botão ---- */
var aGerar=false;
/* Uma queixa sem sítio não serve para nada: a Câmara não sabe onde ir.
   Não se bloqueia — avisa-se uma vez e, se a pessoa insistir, escreve-se.
   Bloquear seria dizer «não» a quem já está a custar-lhe pedir. D-019 */
var avisadoLocal=false;
function esconderAvisoLocal(){
  var el=document.getElementById('avisoLocal');
  if(el){ el.classList.add('hidden'); }
  avisadoLocal=false;
}

function gerar(){
  if(aGerar) return;
  var d=recolher();

  if(d.a.tipo==='queixa' && !d.local && !avisadoLocal){
    var av=document.getElementById('avisoLocal');
    av.innerHTML=t('falta_local');
    av.classList.remove('hidden');
    avisadoLocal=true;
    var campo=document.getElementById('local');
    if(campo){ campo.focus(); campo.scrollIntoView({block:'center'}); }
    return;
  }
  var btn=document.getElementById('btnGerar');
  var est=document.getElementById('estado');

  function mostrar(corpo, veioDaAPI, falhou){
    document.getElementById('textoCarta').textContent = montarCarta(d, corpo);
    document.getElementById('notaIA').innerHTML = veioDaAPI ? t('nota_ia') : t('nota_modelo');
    document.getElementById('resultado').classList.remove('hidden');
    document.getElementById('msgCopiado').classList.add('hidden');

    var r=document.getElementById('resumoEN');
    if(LANG==='en'){
      r.innerHTML='<strong>What the letter says, in plain English:</strong> it is addressed to the Presidente da Câmara Municipal de Penamacor — the mayor'+
        (d.junta?', copied to the Junta de Freguesia':'')+
        '. It gives your name and address, sets out the matter'+(d.local?' at <em>'+d.local+'</em>':'')+(d.desde?' ('+d.desde+')':'')+
        ', notes that the matter falls to the Município'+(d.fotos?', says photographs are enclosed':'')+
        ', and '+d.a.resumo+' It also asks for a written reply and for an indication of when the work will be done'+
        (d.grupo?', with space for other residents to sign':'')+'.';
      r.classList.remove('hidden');
    } else r.classList.add('hidden');

    /* A secretaria faz a entrada e é o que faz o prazo correr; o Presidente é
       a quem a carta é dirigida; o serviço é quem trata. Acrescenta-se, não se
       substitui. D-021 */
    var para='presidente@cm-penamacor.pt,secretaria.gap@cm-penamacor.pt';
    if(d.a.servico) para+=','+d.a.servico;
    var copias=[];
    if(d.junta) copias.push('uniaofreguesias050713@gmail.com');
    var cc=copias.length?'?cc='+copias.join(',')+'&':'?';
    document.getElementById('btnEmail').href='mailto:'+para+cc+
      'subject='+encodeURIComponent(d.a.linha+' — Aldeia de João Pires')+
      '&body='+encodeURIComponent(document.getElementById('textoCarta').textContent);

    if(falhou){ est.innerHTML=t('estado_falhou'); est.className='estado mau'; }
    else { est.className='estado hidden'; }

    btn.innerHTML=t('btn_gerar'); btn.disabled=false; aGerar=false;
    document.getElementById('resultado').scrollIntoView({behavior:'smooth'});
  }

  /* sem API configurada: modelo, sem espera nem aviso */
  if(!CONFIG.API){ mostrar(corpoModelo(d), false, false); return; }

  aGerar=true;
  btn.disabled=true;
  btn.innerHTML=t('btn_gerar_ocupado');
  est.innerHTML=t('estado_espera'); est.className='estado';

  pedirTexto(d).then(function(corpo){
    if(corpo) mostrar(corpo, true, false);
    else      mostrar(corpoModelo(d), false, true);
  });
}

function copiar(){
  var txt=document.getElementById('textoCarta').textContent;
  var ok=function(){
    var m=document.getElementById('msgCopiado'); m.classList.remove('hidden');
    setTimeout(function(){m.classList.add('hidden');},6000);
  };
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); try{document.execCommand('copy'); ok();}catch(e){}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok,fallback);
  } else fallback();
}

/* arranque */
(function(){
  /* ADR-024: o que ficou guardado manda; a detecção do idioma do
     aparelho só vale no primeiro arranque, quando não há nada guardado. */
  var nav=(navigator.language||'pt').toLowerCase();
  var lingua=lerPref('lingua', nav.indexOf('pt')===0 ? 'pt' : 'en');

  var tema=lerPref('tema','sereno');
  var btnTema=document.querySelector('.tema[data-tema="'+tema+'"]');
  if(btnTema) setTema(tema,btnTema);

  var px=parseInt(lerPref('letra','19'),10);
  if(px===23||px===28){
    var btnLetra=document.querySelector('.painel .s'+(px===23?'2':'3'));
    if(btnLetra) letra(px,btnLetra);
  }

  setLang(lingua==='en'?'en':'pt');
  ajustarOpcoes();
})();

</script>
</body>
</html>
